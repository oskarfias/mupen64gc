# Despliegue de bikrom.com en Render (Blueprint). El sitio vive en la carpeta bikrom/.
services:
  - type: web
    name: bikrom
    runtime: node
    rootDir: bikrom
    plan: free               # temporal mientras bikrom.com pasa a Cloudflare (bikrom/cloudflare/README.md); sin disco
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    domains:
      - bikrom.com
      - www.bikrom.com
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SITE_URL
        value: https://bikrom.com
      - key: PREVIEW          # cambia a "false" para lanzar (activa pagos e indexación)
        value: "true"
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true   # consúltala en Render → Environment
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: Bikrom <hola@bikrom.com>
      - key: EMAIL_NOTIFY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      # ── Bikrom Photography (/photography) ──
      - key: NODE_ENV
        value: production
      - key: APP_SECRET
        generateValue: true
      - key: PHOTO_ADMIN_PASSWORD
        generateValue: true   # contraseña del panel de fotografía: consúltala en Render → Environment
      - key: STORAGE_DRIVER
        value: local          # cambia a "s3" al conectar Cloudflare R2 / Backblaze B2 (ver photography/README.md)
      - key: PHOTO_EMAIL_FROM
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: CRON_SECRET
        generateValue: true
      # ── Bikrom/HabitoOS (/habitoos) ──
      - key: HABITOOS_EMAIL_FROM
        sync: false
      - key: HABITOOS_STRIPE_SECRET_KEY
        sync: false
      - key: HABITOOS_STRIPE_WEBHOOK_SECRET
        sync: false
